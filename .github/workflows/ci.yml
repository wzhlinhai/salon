name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Python script tests
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s backend/scripts -p 'test_*.py'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
      - name: sqlc generated code is up to date
        run: go tool sqlc diff
      - name: go test
        # CI 是全量测试的最终结果：恢复的 Go 缓存里存有旧的测试结果，-count=1 强制每个包真跑。
        run: go test -count=1 ./...

  admin:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- app/utils/api.d.ts || {
            echo "app/utils/api.d.ts is stale: run 'npm run generate:api' in admin/ and commit it"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck

  # e2e 按文件拆成 3 台机器并行，每台起自己的后端和全新数据库，互不干扰。
  # 全店级用例（工资锁月、全店顾客分页、团购对账、日结封账）本地要等默认项目跑完；
  # 这里放在第 3 片自己那份默认用例之后跑（--no-deps 不再拉起整套默认项目），日结最后单独跑。
  e2e-shard:
    name: e2e (${{ matrix.shard }}/3)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: admin
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        working-directory: admin
        run: |
          # runner 镜像已带 Chromium 所需系统库；apt 镜像不可达曾导致 CI 失败，故只下载浏览器。
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Playwright browser install attempt ${attempt}/3"
            if npx playwright install chromium; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Playwright browser install failed after 3 attempts"
              exit 1
            fi

            if [ "${attempt}" -eq 1 ]; then
              delay=30
            else
              delay=60
            fi
            echo "Playwright browser install failed; retrying in ${delay}s..."
            sleep "${delay}"
          done
      - run: scripts/dev.sh up
        env:
          # CI 上 nuxt dev 首次编译较慢。
          DEV_WAIT_SECONDS: 180
      - run: npx playwright test --project=default --shard=${{ matrix.shard }}/3
        working-directory: admin
      - if: matrix.shard == 3
        run: npx playwright test --no-deps --project=payroll-store --project=store-customer-dataset --project=groupbuy-month
        working-directory: admin
      - if: matrix.shard == 3
        run: npx playwright test --no-deps --project=closing
        working-directory: admin
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            admin/test-results
            .dev/*.log

  # 汇总成一个「e2e」检查：三片都过才算过，合并前看这一项即可。
  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
