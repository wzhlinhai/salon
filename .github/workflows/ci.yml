name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Python script tests
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s backend/scripts -p 'test_*.py'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
      - name: sqlc generated code is up to date
        run: go tool sqlc diff
      - name: go test
        # CI 是全量测试的最终结果：恢复的 Go 缓存里存有旧的测试结果，-count=1 强制每个包真跑。
        run: go test -count=1 ./...

  admin:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- app/utils/api.d.ts || {
            echo "app/utils/api.d.ts is stale: run 'npm run generate:api' in admin/ and commit it"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: admin
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers and dependencies
        working-directory: admin
        run: |
          # apt 源偶发解析失败，浏览器和系统依赖安装最多重试三次。
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3"
            sudo apt-get update || echo "apt-get update failed; continuing to install attempt"

            if npx playwright install-deps chromium && npx playwright install chromium; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Playwright install failed after 3 attempts"
              exit 1
            fi

            if [ "${attempt}" -eq 1 ]; then
              delay=30
            else
              delay=60
            fi
            echo "Playwright install failed; retrying in ${delay}s..."
            sleep "${delay}"
          done
      - run: scripts/dev.sh up
        env:
          # CI 上 nuxt dev 首次编译较慢。
          DEV_WAIT_SECONDS: 180
      - run: npm run e2e
        working-directory: admin
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          include-hidden-files: true
          path: |
            admin/test-results
            .dev/*.log
