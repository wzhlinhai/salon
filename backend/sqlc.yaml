version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - column: items.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: items.labor_fee_amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
              pointer: true
          - column: items.labor_fee_percent
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Percent
              pointer: true
          - column: item_level_prices.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.principal_before
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.principal_delta
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Change
          - column: card_ledger.principal_after
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.bonus_before
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.bonus_delta
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Change
          - column: card_ledger.bonus_after
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_type_items.unit_price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_items.unit_price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
