version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          # 消费流水的负增量转为非负支付金额；LEFT JOIN 的空值保留为 nil。
          - db_type: pg_catalog.numeric
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - column: items.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: items.labor_fee_amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
              pointer: true
          - column: items.labor_fee_percent
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Percent
              pointer: true
          - column: item_level_prices.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: item_member_prices.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.principal_before
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.principal_delta
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Change
          - column: card_ledger.principal_after
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.bonus_before
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_ledger.bonus_delta
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Change
          - column: card_ledger.bonus_after
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_type_items.unit_price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_items.unit_price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_upgrade_rules.threshold
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: order_items.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: order_payments.amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_types.discount_percent
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Percent
              pointer: true
          - column: order_items.discount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: debts.amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: debt_repayments.amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: red_packets.face_value
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: red_packets.price
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
              pointer: true
          - column: card_refunds.principal
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_refunds.bonus
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_refunds.counts_amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_refunds.bonus_deducted
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_refunds.fee
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: card_refunds.amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: performance_entries.paid_amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
          - column: performance_entries.amount
            go_type:
              import: github.com/wzhlinhai/salon/backend/internal/money
              type: Amount
